# Build cl-protobufs OCI package with native overlays (protoc toolchain + pre-generated .lisp).
name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: from tag)"
        required: false
        default: ""
      registry:
        description: "OCI registry (default: ghcr.io)"
        required: false
        default: ""

env:
  DEFAULT_REGISTRY: ghcr.io
  # Official static protoc release shipped in the native overlay (zero runtime deps,
  # unlike brew's protoc which is dynamically linked against brew libs).
  PROTOC_VERSION: "34.1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            protoc_platform: linux-x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            protoc_platform: linux-aarch_64
          - os: darwin
            arch: arm64
            runner: macos-latest
            protoc_platform: osx-aarch_64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew (Linux)
        if: matrix.os == 'linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Add Homebrew to environment (Linux)
        if: matrix.os == 'linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          BREW_PREFIX="/home/linuxbrew/.linuxbrew"
          {
            echo "HOMEBREW_PREFIX=${BREW_PREFIX}"
            echo "HOMEBREW_CELLAR=${BREW_PREFIX}/Cellar"
            echo "HOMEBREW_REPOSITORY=${BREW_PREFIX}/Homebrew"
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig"
            echo "CPATH=${BREW_PREFIX}/include"
            echo "LIBRARY_PATH=${BREW_PREFIX}/lib"
            echo "LD_LIBRARY_PATH=${BREW_PREFIX}/lib"
          } >> "$GITHUB_ENV"

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential patchelf
          brew install protobuf cmake pkg-config

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install protobuf cmake pkg-config

      - name: Build protoc-gen-cl-pb
        run: |
          rm -rf protoc/build
          cmake -S protoc -B protoc/build -DCMAKE_CXX_STANDARD=17
          NPROC=$( (nproc || sysctl -n hw.ncpu) 2>/dev/null )
          cmake --build protoc/build --parallel "${NPROC}"

      - name: Pre-generate well-known-types .lisp files
        run: |
          mkdir -p generated
          for proto in descriptor any source_context type api duration empty field_mask timestamp wrappers struct; do
            protoc --proto_path=google/protobuf/ \
              --plugin=protoc-gen-cl-pb=protoc/build/protoc-gen-cl-pb \
              --cl-pb_out="output-file=${proto}.lisp:generated/" \
              "${proto}.proto" \
              --experimental_allow_proto3_optional
          done
          ls -la generated/

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/lib artifacts/generated
          # Self-contained plugin: bundle brew-linked shared libs + rewrite rpaths
          chmod +x scripts/bundle-protoc-plugin.sh
          ./scripts/bundle-protoc-plugin.sh protoc/build/protoc-gen-cl-pb artifacts/lib
          # Official static protoc release binary (portable, no dynamic deps)
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${{ matrix.protoc_platform }}.zip"
          unzip -j -o /tmp/protoc.zip bin/protoc -d artifacts/lib
          cp generated/*.lisp artifacts/generated/
          chmod +x artifacts/lib/protoc artifacts/lib/protoc-gen-cl-pb
          artifacts/lib/protoc --version

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Stage overlays OUTSIDE the checkout: build-package tars the whole
      # source-dir into the source layer, so anything staged inside the repo
      # would be swept into every published source tarball.
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/native-artifacts/

      - name: Arrange overlay directories
        run: |
          OVERLAY_ROOT="${RUNNER_TEMP}/overlays"
          echo "OVERLAY_ROOT=${OVERLAY_ROOT}" >> "$GITHUB_ENV"
          for dir in "${RUNNER_TEMP}"/native-artifacts/native-*; do
            [ -d "$dir" ] || continue
            slug=$(basename "$dir" | sed 's/^native-//')
            os=$(echo "$slug" | cut -d- -f1)
            arch=$(echo "$slug" | cut -d- -f2)
            mkdir -p "${OVERLAY_ROOT}/lib/${os}-${arch}" "${OVERLAY_ROOT}/generated/${os}-${arch}"
            cp "$dir"/lib/* "${OVERLAY_ROOT}/lib/${os}-${arch}/"
            cp "$dir"/generated/* "${OVERLAY_ROOT}/generated/${os}-${arch}/"
            chmod +x "${OVERLAY_ROOT}/lib/${os}-${arch}/"*
            echo "${os}/${arch}" >> /tmp/platforms.txt
          done
          echo "Platforms:"; cat /tmp/platforms.txt
          find "${OVERLAY_ROOT}" -type f

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install Quicklisp
        run: |
          curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"~/quicklisp/")'
          sbcl --noinform --non-interactive \
            --load ~/quicklisp/setup.lisp \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))'

      # setup-oras@v1 bundles a fixed release manifest: 1.3.1+ is not listed yet; default 1.3.0 linux_arm64
      # sometimes 404 in act. 1.2.3 is in the manifest with linux_arm64 checksums.
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3

      - name: Pull cl-repository-packager from GHCR
        run: |
          CL_REPO_TAG="0.8.0"
          CL_REPO_IMAGE="ghcr.io/egao1980/cl-repository/cl-repository-packager"
          rm -rf /tmp/cl-repo-pull
          mkdir -p /tmp/cl-repo-pull ~/.local/share/cl-systems
          rm -rf ~/.local/share/cl-systems/cl-oci-*
          oras pull "${CL_REPO_IMAGE}:${CL_REPO_TAG}" -o /tmp/cl-repo-pull/
          for f in /tmp/cl-repo-pull/*.tar.gz; do
            tar -xzf "$f" -C ~/.local/share/cl-systems/
          done

      - name: Build and publish OCI package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="${{ inputs.registry || env.DEFAULT_REGISTRY }}"
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          NAMESPACE="${{ github.repository_owner }}/cl-systems"
          NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')

          if [ "$REGISTRY" = "ghcr.io" ]; then
            REGISTRY_URL="https://${REGISTRY}"
          else
            REGISTRY_URL="http://${REGISTRY}"
          fi

          cat > /tmp/publish.lisp <<'LISP'
          (require :asdf)
          (asdf:initialize-source-registry
            '(:source-registry
              (:tree (:home ".local/share/cl-systems/"))
              :inherit-configuration))
          (load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))
          (ql:quickload :cl-repository-packager)

          (let* ((version (uiop:getenv "PKG_VERSION"))
                 (registry-url (uiop:getenv "REGISTRY_URL"))
                 (namespace (uiop:getenv "OCI_NAMESPACE"))
                 (use-auth (string= "ghcr.io" (uiop:getenv "OCI_REGISTRY")))
                 (auth (when use-auth
                         (cl-oci-client/auth:make-auth-config
                           :username (uiop:getenv "GITHUB_ACTOR")
                           :password (uiop:getenv "GITHUB_TOKEN"))))
                 (reg (if use-auth
                         (cl-oci-client/registry:make-registry registry-url :auth auth)
                         (cl-oci-client/registry:make-registry registry-url)))
                 (platform-lines (uiop:read-file-lines "/tmp/platforms.txt"))
                 (generated-files '(("descriptor.lisp" . "descriptor.lisp")
                                    ("any.lisp" . "any.lisp")
                                    ("source_context.lisp" . "source_context.lisp")
                                    ("type.lisp" . "type.lisp")
                                    ("api.lisp" . "api.lisp")
                                    ("duration.lisp" . "duration.lisp")
                                    ("empty.lisp" . "empty.lisp")
                                    ("field_mask.lisp" . "field_mask.lisp")
                                    ("timestamp.lisp" . "timestamp.lisp")
                                    ("wrappers.lisp" . "wrappers.lisp")
                                    ("struct.lisp" . "struct.lisp")))
                 (overlay-root (uiop:ensure-directory-pathname (uiop:getenv "OVERLAY_ROOT")))
                 (overlays
                   (loop for line in platform-lines
                         for slash = (position #\/ line)
                         when slash
                         collect
                         (let* ((os (subseq line 0 slash))
                                (arch (subseq line (1+ slash)))
                                (prefix (format nil "~a-~a" os arch))
                                (lib-dir (merge-pathnames (format nil "lib/~a/" prefix)
                                                          overlay-root))
                                ;; protoc + protoc-gen-cl-pb + its bundled shared libs.
                                ;; NOTE: (directory #p"*") would skip files with
                                ;; extensions on SBCL; uiop:directory-files gets all.
                                (native-files
                                  (loop for p in (uiop:directory-files lib-dir)
                                        collect (cons (namestring p) (file-namestring p)))))
                           (unless native-files
                             (error "No native files found under ~a" lib-dir))
                           (make-instance 'cl-repository-packager/build-matrix:overlay-spec
                             :os os :arch arch
                             :layers
                             (list
                               (list :role "native-library"
                                     :files native-files)
                               (list :role "generated-source"
                                     :files (mapcar
                                              (lambda (pair)
                                                (cons (namestring
                                                       (merge-pathnames
                                                        (format nil "generated/~a/~a" prefix (car pair))
                                                        overlay-root))
                                                      (cdr pair)))
                                              generated-files)))))))
                 (spec (make-instance 'cl-repository-packager/build-matrix:package-spec
                         :name "cl-protobufs"
                         :version version
                         :source-dir (uiop:getcwd)
                         :license "MIT"
                         :description "Protocol Buffers for Common Lisp"
                         :depends-on '("closer-mop" "alexandria" "trivial-garbage"
                                       "cl-base64" "local-time" "float-features")
                         :provides '("cl-protobufs" "cl-protobufs.asdf")
                         :overlays overlays))
                 (result (cl-repository-packager/build-matrix:build-package spec)))
            (format t "~%Overlays: ~{~a~^, ~}~%" platform-lines)
            (cl-repository-packager/publisher:publish-package
              reg namespace version result spec)
            (format t "Published cl-protobufs:~a to ~a/~a~%" version registry-url namespace))
          LISP

          PKG_VERSION="$VERSION" \
          OCI_REGISTRY="$REGISTRY" \
          REGISTRY_URL="$REGISTRY_URL" \
          GITHUB_ACTOR="${{ github.actor }}" \
          OCI_NAMESPACE="$NAMESPACE" \
          sbcl --noinform --non-interactive --load /tmp/publish.lisp

      - name: Verify published artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="${{ inputs.registry || env.DEFAULT_REGISTRY }}"
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          NAMESPACE="${{ github.repository_owner }}/cl-systems"
          NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          if [ "$REGISTRY" = "ghcr.io" ]; then
            oras manifest fetch "${REGISTRY}/${NAMESPACE}/cl-protobufs:${VERSION}" \
              --registry-config <(echo "{\"auths\":{\"ghcr.io\":{\"username\":\"${{ github.actor }}\",\"password\":\"${GITHUB_TOKEN}\"}}}")
          else
            oras manifest fetch "${REGISTRY}/${NAMESPACE}/cl-protobufs:${VERSION}" --insecure --plain-http
          fi
